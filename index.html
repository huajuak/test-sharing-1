<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
  <title>เล่นหุ้น - Stock Trading Game</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>📈 เล่นหุ้น</h1>
      <div id="portfolio-summary">
        <div class="stat">
          <span class="label">เงินสด</span>
          <span class="value" id="cash">฿100,000</span>
        </div>
        <div class="stat">
          <span class="label">มูลค่าหุ้น</span>
          <span class="value" id="stock-value">฿0</span>
        </div>
        <div class="stat">
          <span class="label">รวมทั้งหมด</span>
          <span class="value" id="total-value">฿100,000</span>
        </div>
        <div class="stat">
          <span class="label">กำไร/ขาดทุน</span>
          <span class="value" id="pnl">฿0 (0%)</span>
        </div>
      </div>
      <div id="round-info">
        <span>รอบที่ <strong id="round-num">1</strong> / 30</span>
        <button id="next-round-btn" onclick="nextRound()">ถัดไป ▶</button>
        <button id="reset-btn" onclick="resetGame()">เริ่มใหม่ 🔄</button>
      </div>
    </header>

    <div id="news-ticker" class="ticker-wrap">
      <div class="ticker" id="ticker-content"></div>
    </div>

    <main>
      <section id="market-section">
        <h2>ตลาดหุ้น</h2>
        <div id="stock-list"></div>
      </section>

      <section id="portfolio-section">
        <h2>พอร์ตของฉัน</h2>
        <div id="portfolio-list"><p class="empty-msg">ยังไม่มีหุ้นในพอร์ต</p></div>
      </section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h3 id="modal-title"></h3>
        <p id="modal-stock-info"></p>
        <div class="modal-row">
          <label>จำนวนหุ้น:</label>
          <input type="number" id="modal-qty" min="1" value="1" oninput="updateModalTotal()">
        </div>
        <p id="modal-total"></p>
        <div class="modal-actions">
          <button id="modal-confirm-btn"></button>
          <button onclick="closeModal()">ยกเลิก</button>
        </div>
      </div>
    </div>

    <div id="game-over" class="modal hidden">
      <div class="modal-box">
        <h2>🏁 จบเกม!</h2>
        <p id="final-result"></p>
        <p id="final-score"></p>
        <button onclick="resetGame()">เล่นอีกครั้ง 🔄</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
